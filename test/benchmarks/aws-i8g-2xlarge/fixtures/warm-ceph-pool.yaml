# Forces Karpenter to build out the Ceph storage pool before Rook runs.
#
# Rook pins each daemon to a node by hostname affinity, and Karpenter will not
# provision a node for a pod that already names one, so a pool that scales on
# demand deadlocks: the daemons wait for nodes that are waiting for the
# daemons. This holds one pod per node with nothing but a pause container, so
# the nodes exist before Ceph asks for them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceph-pool-warmer
  namespace: rook-ceph
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ceph-pool-warmer
  template:
    metadata:
      labels:
        app: ceph-pool-warmer
    spec:
      nodeSelector:
        materialize.cloud/storage-pool: ceph
      tolerations:
        - key: materialize.cloud/storage-pool
          operator: Equal
          value: ceph
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ceph-pool-warmer
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 100m
              memory: 32Mi

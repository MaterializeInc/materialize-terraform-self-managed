[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
]

[bans]
multiple-versions = "deny"
skip = [
    # Do not add to this list without good reason! Duplicate dependencies slow
    # down compilation and bloat the binary.

    # AWS SDK smithy crates support both http 0.2 and 1.x during their
    # transition. Cannot be eliminated from the consumer side.
    { name = "getrandom", version = "0.2.17" },
    { name = "http", version = "0.2.12" },
    { name = "http-body", version = "0.4.6" },
    { name = "rand_core", version = "0.6.4" },

    # aws-smithy-checksums and p256 still use RustCrypto 0.10 while aws-sigv4
    # and aws-sdk-s3 use 0.11. Cannot be eliminated from the consumer side.
    { name = "block-buffer", version = "0.10.4" },
    { name = "const-oid", version = "0.9.6" },
    { name = "cpufeatures", version = "0.2.17" },
    { name = "crypto-common", version = "0.1.7" },
    { name = "digest", version = "0.10.7" },
    { name = "hmac", version = "0.12.1" },
    { name = "sha1", version = "0.10.6" },
    { name = "sha2", version = "0.10.9" },

    # Serde now uses v3.0, and the rest of the ecosystem will eventually catch up.
    { name = "syn", version = "2.0.117" },

    # indexmap (via h2) uses hashbrown 0.16, lru (via aws-sdk-s3) uses 0.17.
    # Both are transitive AWS SDK deps.
    { name = "hashbrown", version = "0.16.1" },
]

# Use `tracing` instead.
[[bans.deny]]
name = "env_logger"

# Use `prost` or `protobuf-native` instead.
[[bans.deny]]
name = "protobuf"

# Use `sha1` instead; `sha-1` is the old, deprecated name.
[[bans.deny]]
name = "sha-1"

# Strum has suspect code quality and includes many unneeded features. Use
# more targeted enum macro crates, e.g. `enum-kinds`.
[[bans.deny]]
name = "strum"
[[bans.deny]]
name = "strum-macros"

# The `uncased` crate serves the same purpose as `unicase` and is more
# actively maintained.
[[bans.deny]]
name = "unicase"

# Do not pull in the materialize repo's workspace-hack: its many dependencies
# make builds slower and flakier and version bumps harder.
[[bans.deny]]
name = "workspace-hack"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
# Only MaterializeInc-owned Git repositories, so maintainership is shared and
# old versions stay buildable if upstream repos disappear. Ask in #eng-infra if
# you cannot create a fork in the MaterializeInc organization.
#allow-org = { github = ["MaterializeInc"] }

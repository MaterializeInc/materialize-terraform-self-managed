name: Tag

on:
  workflow_dispatch:
    inputs:
      confirm_major:
        description: Confirm a major version bump
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

# Serialize runs so concurrent runs cannot race on computing the next version.
concurrency:
  group: tag-main

jobs:
  tag:
    name: Tag and Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Compute the next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIRM_MAJOR: ${{ inputs.confirm_major }}
        run: |
          set -euo pipefail
          blockers=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label release-blocker \
            --json number,title --jq '.[] | "#\(.number) \(.title)"')
          if [ -n "$blockers" ]; then
            echo "::error::Open PRs labeled release-blocker:"
            echo "$blockers"
            exit 1
          fi

          latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Latest release: $latest"

          # Everything merged since the latest release is part of this
          # release.
          prs=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$GITHUB_SHA" --jq '.commits[].sha' \
            | while read -r sha; do
                gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                  --jq '.[] | select(.merged_at != null) | .number'
              done | sort -un)

          # The highest bump level across all merged PRs wins. Commits without
          # a PR or without version labels are released with the next labeled
          # PR.
          bump=""
          for pr in $prs; do
            while IFS= read -r label; do
              case "$label" in
                breaking-change) bump=major ;;
                enhancement) if [ "$bump" != major ]; then bump=minor; fi ;;
                bug|dependencies|documentation|github_actions) if [ -z "$bump" ]; then bump=patch; fi ;;
              esac
            done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.labels[].name')
          done

          if [ -z "$bump" ]; then
            echo "No version label on any PR merged since $latest, not creating a release"
            exit 0
          fi

          if [ "$bump" = major ] && [ "$CONFIRM_MAJOR" != true ]; then
            echo "::error::Release since $latest is a major bump, rerun with confirm_major=true to confirm"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$bump" in
            major) version="v$((major + 1)).0.0" ;;
            minor) version="v$major.$((minor + 1)).0" ;;
            patch) version="v$major.$minor.$((patch + 1))" ;;
          esac

          echo "Next release: $version ($bump bump from $latest)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.version.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The bot token's pushes trigger CI on the upgrade notes PR, the
          # default GITHUB_TOKEN's don't.
          token: ${{ secrets.MATERIALIZE_BOT_TOKEN }}

      - name: Install changie
        if: steps.version.outputs.version != ''
        run: .github/scripts/install-changie.sh

      # Upgrade notes merged since the latest release are batched into
      # UPGRADING.md by a PR first. Once it merges, the next run releases.
      - name: Open the upgrade notes PR
        id: notes
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.MATERIALIZE_BOT_TOKEN }}
          LATEST: ${{ steps.version.outputs.latest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! compgen -G '.changes/unreleased/*.yaml' > /dev/null; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pending=true" >> "$GITHUB_OUTPUT"

          if [ -e ".changes/$VERSION.md" ]; then
            echo "::error::Upgrade notes merged after .changes/$VERSION.md was created. Move them into that file, run changie merge, and merge that before releasing."
            exit 1
          fi

          branch="upgrade-notes-$VERSION"
          pr=$(gh pr list --head "$branch" --state open --json url --jq '.[].url')
          if [ -z "$pr" ]; then
            changie batch "$VERSION"
            changie merge
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add -A .changes UPGRADING.md
            git commit -m "Upgrade notes for $VERSION"
            git push --force origin "$branch"
            pr=$(gh pr create --base main --head "$branch" \
              --title "Upgrade notes for $VERSION" \
              --label ignore-for-release \
              --body "Moves the upgrade notes merged since $LATEST into UPGRADING.md. Merge this, then run the Tag workflow again to release $VERSION.")
          fi
          echo "::notice::Merge $pr, then run this workflow again to release $VERSION."
          echo "Merge $pr, then run this workflow again to release $VERSION." >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        if: steps.notes.outputs.pending == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.version.outputs.latest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Notes batched for another version mean a PR with a higher bump
          # merged after the upgrade notes PR.
          for f in .changes/v*.md; do
            v=$(basename "$f" .md)
            newest=$(printf '%s\n%s\n' "$LATEST" "$v" | sort -V | tail -n 1)
            if [ "$v" != "$LATEST" ] && [ "$v" = "$newest" ] && [ "$v" != "$VERSION" ]; then
              echo "::error::Upgrade notes are batched for $v, but this release is $VERSION. Rename .changes/$v.md, fix its heading, and run changie merge."
              exit 1
            fi
          done

          notes=()
          if [ -e ".changes/$VERSION.md" ]; then
            { echo "## Upgrade notes"; tail -n +2 ".changes/$VERSION.md"; } > "$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi

          echo "Creating release $VERSION"
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            "${notes[@]}"

name: Tag

on:
  workflow_dispatch:
    inputs:
      confirm_major:
        description: Confirm a major version bump
        type: boolean
        default: false
  # Merging an upgrade notes PR releases its version from the merge commit, so
  # nothing merged afterwards can slip into the release.
  pull_request:
    types: [closed]
    branches: [main]
    paths: [UPGRADING.md]

permissions:
  contents: write
  pull-requests: read

jobs:
  tag:
    name: Tag and Release
    # Serialize runs so concurrent runs cannot race on computing the next
    # version. On the job, so skipped runs for other merged PRs don't queue.
    concurrency:
      group: tag-main
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'materialize-bot' &&
       startsWith(github.event.pull_request.head.ref, 'upgrade-notes-v'))
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      NOTES_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Compute the next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIRM_MAJOR: ${{ inputs.confirm_major }}
        run: |
          set -euo pipefail
          blockers=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label release-blocker \
            --json number,title --jq '.[] | "#\(.number) \(.title)"')
          if [ -n "$blockers" ]; then
            echo "::error::Open PRs labeled release-blocker:"
            echo "$blockers"
            exit 1
          fi

          latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Latest release: $latest"

          # Everything merged since the latest release is part of this
          # release.
          prs=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$TARGET_SHA" --jq '.commits[].sha' \
            | while read -r sha; do
                gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                  --jq '.[] | select(.merged_at != null) | .number'
              done | sort -un)

          # The highest bump level across all merged PRs wins. Commits without
          # a PR or without version labels are released with the next labeled
          # PR.
          bump=""
          breaking=""
          for pr in $prs; do
            while IFS= read -r label; do
              case "$label" in
                breaking-change) bump=major; breaking="$breaking #$pr" ;;
                enhancement) if [ "$bump" != major ]; then bump=minor; fi ;;
                bug|dependencies|documentation|github_actions) if [ -z "$bump" ]; then bump=patch; fi ;;
              esac
            done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.labels[].name')
          done

          if [ -z "$bump" ]; then
            echo "No version label on any PR merged since $latest, not creating a release"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$bump" in
            major) version="v$((major + 1)).0.0" ;;
            minor) version="v$major.$((minor + 1)).0" ;;
            patch) version="v$major.$minor.$((patch + 1))" ;;
          esac

          # A merged notes PR names the version it was opened for, after any
          # major bump was confirmed. Anything else means the bump changed
          # after it was opened.
          if [ -n "$NOTES_BRANCH" ]; then
            expected="${NOTES_BRANCH#upgrade-notes-}"
            if [ "$version" != "$expected" ]; then
              echo "::error::The notes PR was for $expected, but the merge commit releases $version. Run this workflow on main to rebuild the notes PR."
              exit 1
            fi
            CONFIRM_MAJOR=true
          fi

          if [ "$bump" = major ] && [ "$CONFIRM_MAJOR" != true ]; then
            echo "::error::$version would be a major bump from $latest (breaking-change:$breaking), rerun with confirm_major=true to confirm"
            exit 1
          fi

          echo "Next release: $version ($bump bump from $latest)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.version.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          # No token in .git/config while scriv runs. The push step passes the
          # bot token itself.
          persist-credentials: false

      - name: Install scriv
        if: steps.version.outputs.version != ''
        run: pipx install scriv==1.8.0

      # Pending upgrade notes go into UPGRADING.md through a PR. Merging it
      # runs this workflow again, which finds none and releases.
      - name: Collect upgrade notes
        id: notes
        if: steps.version.outputs.version != ''
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Notes collected for a version newer than the latest release, but not
          # this one, mean a PR with a bigger bump merged after the notes PR.
          top=$(grep -m 1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+$' UPGRADING.md | cut -c4- || true)
          if [ -n "$top" ] && [ "$top" != "$LATEST" ] && [ "$top" != "$VERSION" ] &&
            [ "$(printf '%s\n' "$LATEST" "$top" | sort -V | tail -n 1)" = "$top" ]; then
            echo "::error::UPGRADING.md has notes for $top, but this release is $VERSION. Rename that heading in a PR, then run this again."
            exit 1
          fi

          if compgen -G 'changelog.d/*.md' > /dev/null; then
            if ! scriv collect --version "$VERSION"; then
              echo "::error::Upgrade notes merged after the $VERSION notes PR. Add them to its section in UPGRADING.md by hand and delete them from changelog.d/, then run this again."
              exit 1
            fi
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      # Each run rebuilds the PR from main and force-pushes it, so an open notes
      # PR picks up notes merged since it was opened.
      - name: Open the upgrade notes PR
        if: steps.notes.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.MATERIALIZE_BOT_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="upgrade-notes-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A changelog.d UPGRADING.md
          git commit -m "Upgrade notes for $VERSION"
          # The bot token's pushes trigger CI on the upgrade notes PR, the
          # default GITHUB_TOKEN's don't.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push --force origin "$branch"

          # A bigger bump renames the version, so close notes PRs for any other
          # version: merging one would release the wrong version.
          BRANCH="$branch" gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,headRefName \
            --jq '.[] | select((.headRefName | startswith("upgrade-notes-v")) and .headRefName != env.BRANCH) | .number' \
            | while read -r stale; do
                gh pr close "$stale" --repo "$GITHUB_REPOSITORY" --delete-branch \
                  --comment "Superseded by the upgrade notes PR for $VERSION."
              done

          pr=$(gh pr list --head "$branch" --state open --json url --jq '.[].url')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head "$branch" --label ignore-for-release \
              --title "Upgrade notes for $VERSION" \
              --body "Moves the pending upgrade notes into UPGRADING.md. Merging this releases $VERSION from the merge commit.")
          fi
          echo "::notice::Merge $pr to release $VERSION."

      - name: Create release
        if: steps.version.outputs.version != '' && steps.notes.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Only a release with a section in UPGRADING.md has notes, and then
          # scriv must print them: a failure stops the release.
          args=()
          if grep -qxF "## $VERSION" UPGRADING.md; then
            notes=$(scriv print --version "$VERSION")
            if [ -z "$notes" ]; then
              echo "::error::scriv printed nothing for the $VERSION section of UPGRADING.md"
              exit 1
            fi
            args=(--notes "$(printf '## Upgrade notes\n\n%s' "$notes")")
          fi

          echo "Creating release $VERSION"
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$VERSION" \
            --generate-notes \
            "${args[@]}"

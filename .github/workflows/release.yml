name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install scriv
        run: pipx install scriv==1.8.0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # As in tag.yml: only a release with a section in UPGRADING.md has
          # notes, and then scriv must print them.
          args=()
          if grep -qxF "## $GITHUB_REF_NAME" UPGRADING.md; then
            notes=$(scriv print --version "$GITHUB_REF_NAME")
            if [ -z "$notes" ]; then
              echo "::error::scriv printed nothing for the $GITHUB_REF_NAME section of UPGRADING.md"
              exit 1
            fi
            args=(--notes "$(printf '## Upgrade notes\n\n%s' "$notes")")
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${args[@]}"

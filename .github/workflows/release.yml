name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if compgen -G '.upgrade-notes/*.md' > /dev/null; then
            echo "::error::$GITHUB_REF_NAME has upgrade notes in .upgrade-notes/ that aren't in UPGRADING.md yet. Delete the tag and release with the Tag workflow instead."
            exit 1
          fi

          args=()
          notes=$(.github/scripts/upgrade-notes.sh show "$GITHUB_REF_NAME")
          if [ -n "$notes" ]; then
            printf '## Upgrade notes\n%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
            args=(--notes-file "$RUNNER_TEMP/notes.md")
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${args[@]}"

name: Lint and Validate

on:
  workflow_call:

jobs:
  lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.58.0

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact

  validate:
    name: Validate Simple Examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          # Add new examples here as they are created
          - "aws/examples/simple"
          - "azure/examples/simple"
          - "gcp/examples/simple"
          - "kubernetes/examples/simple"
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"

      - name: Check if example exists
        id: check-dir
        run: |
          if [ ! -d "${{ matrix.example }}" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Example directory ${{ matrix.example }} does not exist, skipping"
          else
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Example directory ${{ matrix.example }} exists"
          fi

      - name: Terraform Init
        if: steps.check-dir.outputs.exists == 'true'
        run: |
          cd ${{ matrix.example }}
          terraform init -backend=false

      - name: Terraform Validate
        if: steps.check-dir.outputs.exists == 'true'
        run: |
          cd ${{ matrix.example }}
          terraform validate

  docs:
    name: Check Generated Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup terraform-docs
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: terraform-docs/terraform-docs
          tag: v0.24.0

      - name: Generate docs
        run: .github/scripts/generate-docs.sh

      - name: Check for diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Module README docs are out of date. Run .github/scripts/generate-docs.sh and commit the changes."
            exit 1
          fi

  shell:
    name: Shell Lint
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        # Pinned by version and checksum, like the other tools here, so that a
        # new shellcheck release cannot flip a green merge queue red without a
        # code change in the PR.
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xJf "$tarball" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # A local-exec command must call a script file rather than carry an
      # inline heredoc, because shellcheck cannot see inside HCL. Without this
      # guard a new inline script would silently go unchecked.
      - name: Check local-exec commands call a script file
        run: |
          set -euo pipefail
          if git grep -nE 'command[[:space:]]*=[[:space:]]*<<' -- '*.tf'; then
            echo "::error::local-exec commands must call a script under <module>/scripts/ so shellcheck can lint it, not an inline heredoc."
            exit 1
          fi
          echo "No inline heredoc commands found."

      # Every script is checked in the dialect its shebang declares: the module
      # scripts say #!/bin/sh, so they are held to POSIX sh, while the tooling
      # scripts under .github are bash.
      - name: ShellCheck shell scripts
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then
            echo "::error::Found no .sh files to check; the glob is wrong."
            exit 1
          fi
          echo "$files"
          echo "$files" | xargs shellcheck

  lint-rust:
    name: Rust Tests Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            test/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('test/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: test
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: test
        run: cargo clippy -- -D warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo deny
        working-directory: test
        # Advisories are checked by the scheduled advisories.yml workflow so
        # that new RUSTSEC reports cannot flip a green merge queue red without
        # any code change in the PR. Bans/licenses/sources are deterministic
        # against Cargo.lock, so they stay blocking.
        run: cargo deny check bans licenses sources

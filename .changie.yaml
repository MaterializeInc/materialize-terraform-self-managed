# Upgrade notes, assembled into UPGRADING.md at release. See CONTRIBUTING.md.
changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: UPGRADING.md
versionExt: md
versionFormat: "## {{.Version}}"
fragmentFileFormat: "{{.Custom.Slug}}"
changeFormat: |-
  ### {{.Custom.Title}}

  {{.Body}}
custom:
  - key: Slug
    label: File name, a short kebab-case slug such as azurerm-5
    type: string
    minLength: 3
  - key: Title
    label: Title, what changes for the user
    type: string
    minLength: 3
newlines:
  afterChangelogHeader: 0
  beforeChangelogVersion: 1
  beforeChange: 1
  endOfVersion: 1
envPrefix: CHANGIE_
